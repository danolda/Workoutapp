<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aesthetic Upper/Lower Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(39, 39, 42, 0.8);
      --primary: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent: #6366f1;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-sub: #71717a;
      --danger: #ef4444;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px calc(110px + var(--safe-bottom));
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.06) 0%, transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .btn-icon:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text-main);
    }

    /* Day Navigation Pill Bar */
    .day-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .day-nav::-webkit-scrollbar { display: none; }

    .day-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .day-btn.active {
      background: var(--primary);
      color: #042f22;
      border-color: var(--primary);
      box-shadow: 0 4px 15px var(--primary-glow);
      font-weight: 700;
    }

    /* Progress & Day Summary */
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 18px;
      backdrop-filter: blur(16px);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .day-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .progress-text {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      width: 0%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* Exercise Card */
    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, transform 0.15s;
    }

    .exercise-card:focus-within {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .ex-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .badge-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }

    .badge.tempo {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.25);
    }

    .badge.rest {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    /* Sets Grid */
    .sets-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .set-btn {
      flex: 1;
      min-width: 58px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .set-btn span.set-num {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .set-btn span.set-icon {
      font-size: 1.1rem;
      line-height: 1;
      color: var(--text-sub);
    }

    .set-btn.completed {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.4);
    }

    .set-btn.completed span.set-num {
      color: #a7f3d0;
    }

    .set-btn.completed span.set-icon {
      color: var(--primary);
    }

    /* Rest Day Banner */
    .rest-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 36px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .rest-icon {
      font-size: 2.8rem;
      margin-bottom: 4px;
    }

    .rest-text {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 340px;
    }

    /* Floating Timer Bar */
    .timer-bar {
      position: fixed;
      bottom: calc(16px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(140%);
      width: calc(100% - 32px);
      max-width: 500px;
      background: rgba(18, 18, 22, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .timer-bar.active {
      transform: translateX(-50%) translateY(0);
    }

    .timer-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .timer-circle {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-circle svg {
      transform: rotate(-90deg);
      width: 48px;
      height: 48px;
    }

    .timer-circle circle {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
    }

    .timer-circle .bg-ring {
      stroke: rgba(255, 255, 255, 0.1);
    }

    .timer-circle .val-ring {
      stroke: var(--primary);
      stroke-dasharray: 126;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-text-wrap {
      display: flex;
      flex-direction: column;
    }

    .timer-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .timer-clock {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .timer-actions {
      display: flex;
      gap: 8px;
    }

    .timer-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .timer-btn.primary {
      background: var(--primary);
      color: #042f22;
      border: none;
    }

    /* Reset button */
    .reset-btn {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--card-border);
      color: var(--text-sub);
      padding: 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div>
        <h1 class="brand-title">ATHLETE LAB</h1>
        <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;">Scientific Upper / Lower Split</div>
      </div>
      <div class="header-actions">
        <button id="soundToggleBtn" class="btn-icon" title="Ses Aç/Kapat">🔊</button>
        <button id="wakeLockBtn" class="btn-icon" title="Ekran Uykusunu Engelle">⚡</button>
      </div>
    </header>

    <!-- Day Selector -->
    <nav class="day-nav" id="dayNav">
      <button class="day-btn active" data-day="0">1. Gün (Üst A)</button>
      <button class="day-btn" data-day="1">2. Gün (Alt A)</button>
      <button class="day-btn" data-day="2">3. Gün (Rest)</button>
      <button class="day-btn" data-day="3">4. Gün (Üst B)</button>
      <button class="day-btn" data-day="4">5. Gün (Alt B)</button>
      <button class="day-btn" data-day="5">Hafta Sonu</button>
    </nav>

    <!-- Summary & Progress Card -->
    <div class="day-card" id="dayHeaderCard">
      <div class="day-header">
        <div class="day-title" id="currentDayTitle">1. Gün: Üst Vücut A</div>
        <div class="progress-text" id="progressStatus">0 / 17 Set</div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Workout Content Container -->
    <div id="exerciseContainer" class="exercise-list">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Reset Day Button -->
    <button class="reset-btn" id="resetDayBtn">🔄 Bu Günün Setlerini Sıfırla</button>
  </div>

  <!-- Floating Intelligent Rest Timer -->
  <div class="timer-bar" id="timerBar">
    <div class="timer-info">
      <div class="timer-circle">
        <svg>
          <circle class="bg-ring" cx="24" cy="24" r="20"></circle>
          <circle class="val-ring" id="timerSvgRing" cx="24" cy="24" r="20"></circle>
        </svg>
      </div>
      <div class="timer-text-wrap">
        <span class="timer-label" id="timerTargetName">Dinlenme</span>
        <span class="timer-clock" id="timerClock">01:30</span>
      </div>
    </div>
    <div class="timer-actions">
      <button class="timer-btn" id="timerAdd15">+15s</button>
      <button class="timer-btn primary" id="timerToggleBtn">Durdur</button>
      <button class="timer-btn" id="timerCloseBtn">Bitir</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. SCIENTIFIC PROGRAM CONFIGURATION
       ========================================================================== */
    const WORKOUT_DAYS = [
      {
        id: 0,
        name: "1. Gün: Üst Vücut A (Dikey Çekiş & Göğüs)",
        isRest: false,
        exercises: [
          { name: "Barfiks (Geniş/Normal Tutuş)", sets: 3, target: "RIR 1–2", tempo: "Kontrollü İniş", rest: 120 },
          { name: "Dips (Gövde Öne Eğik - Göğüs)", sets: 3, target: "8–10 Tekrar", tempo: "Kontrollü", rest: 120 },
          { name: "Decline Şınav", sets: 2, target: "RIR 1", tempo: "Sabit Gerilim", rest: 90 },
          { name: "Biceps Curl", sets: 2, target: "10–12 Tekrar", tempo: "2-0-1-0", rest: 90 },
          { name: "Lateral Raise", sets: 3, target: "12–15 Tekrar", tempo: "Tepe 1s Sıkışma", rest: 90 },
          { name: "Shrug", sets: 2, target: "12–15 Tekrar", tempo: "Tepe 2s Sıkışma", rest: 90 },
          { name: "Boyun Egzersizi (10–12 kg)", sets: 2, target: "15–20 Tekrar", tempo: "Yavaş ve Güvenli", rest: 90 }
        ]
      },
      {
        id: 1,
        name: "2. Gün: Alt Vücut A (Ön Bacak Odaklı)",
        isRest: false,
        exercises: [
          { name: "Split Squat (Bacak Başı)", sets: 3, target: "8–10 Tekrar", tempo: "3-1-1-0", rest: 90, note: "Bacak arası 45s dinlen" },
          { name: "Dumbbell Deadlift / RDL", sets: 3, target: "8–10 Tekrar", tempo: "3-2-1-0", rest: 120, note: "Dipte 2 sn esneme" },
          { name: "Normal Squat", sets: 3, target: "12–15 Tekrar", tempo: "3-1-1-0", rest: 90, note: "Dizleri kitlemeden sürekli tansiyon" },
          { name: "Duvarda Calf Raise (Tek Bacak)", sets: 3, target: "12–15 Tekrar", tempo: "Dipte 2s, Tepede 1s", rest: 90 }
        ]
      },
      {
        id: 2,
        name: "3. Gün: Dinlenme & Rejenerasyon",
        isRest: true,
        restMessage: "Kas proteini sentezi ve sinir sistemi toparlanma evresinde. Hafif yürüyüş, esneme ve bol su tüketimi ile yarınki seansa hazırlanın."
      },
      {
        id: 3,
        name: "4. Gün: Üst Vücut B (Sırt Kalınlığı & Kol Odaklı)",
        isRest: false,
        exercises: [
          { name: "Inverted Row (Dips Barında)", sets: 3, target: "8–10 Tekrar", tempo: "Sırtı Sıkıştır", rest: 90 },
          { name: "Dips (Gövde Öne Eğik - Göğüs)", sets: 3, target: "8–10 Tekrar", tempo: "Kontrollü", rest: 120 },
          { name: "Barfiks", sets: 2, target: "RIR 1", tempo: "Tam Açılma", rest: 120 },
          { name: "Triceps Overhead Extension", sets: 2, target: "10–12 Tekrar", tempo: "2-0-1-0", rest: 90 },
          { name: "Lateral Raise", sets: 3, target: "12–15 Tekrar", tempo: "Tepe 1s Sıkışma", rest: 90 },
          { name: "Shrug", sets: 2, target: "12–15 Tekrar", tempo: "Tepe 2s Sıkışma", rest: 90 },
          { name: "Boyun Egzersizi (10–12 kg)", sets: 2, target: "15–20 Tekrar", tempo: "Yavaş ve Güvenli", rest: 90 }
        ]
      },
      {
        id: 4,
        name: "5. Gün: Alt Vücut B (Arka Zincir Odaklı)",
        isRest: false,
        exercises: [
          { name: "Dumbbell Deadlift / RDL", sets: 3, target: "8–10 Tekrar", tempo: "3-2-1-0", rest: 120, note: "Hamstring tansiyonu" },
          { name: "Split Squat (Bacak Başı)", sets: 3, target: "8–10 Tekrar", tempo: "3-1-1-0", rest: 90, note: "Bacak arası 45s dinlen" },
          { name: "Normal Squat", sets: 3, target: "12–15 Tekrar", tempo: "3-1-1-0", rest: 90 },
          { name: "Duvarda Calf Raise (Tek Bacak)", sets: 3, target: "12–15 Tekrar", tempo: "Dipte 2s, Tepede 1s", rest: 90 }
        ]
      },
      {
        id: 5,
        name: "Hafta Sonu: Tam Dinlenme",
        isRest: true,
        restMessage: "Haftalık 4 günlük antrenman döngüsü tamamlandı! Yeterli protein ve kaliteli uyku ile kas liflerinizi onarın."
      }
    ];

    /* ==========================================================================
       2. AUDIO CONTROLLER & AUDIO SYSTEM
       ========================================================================== */
    let isSoundEnabled = true;
    const audioClips = {
      '60': new Audio('1dk.mp3'),
      '30': new Audio('30s.mp3'),
      '15': new Audio('15s.mp3'),
      '5':  new Audio('5s.mp3')
    };

    // Synthesized Web Audio fallback for final bell/alert
    let audioCtx = null;
    function playSyntheticChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.4);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {
        console.warn("AudioContext chime failed", e);
      }
    }

    function playAlertSound(secondsLeft) {
      if (!isSoundEnabled) return;
      const key = String(secondsLeft);
      if (audioClips[key]) {
        audioClips[key].currentTime = 0;
        audioClips[key].play().catch(() => {
          playSyntheticChime();
        });
      } else if (secondsLeft === 0) {
        playSyntheticChime();
      }
    }

    // Unlocking Audio on first mobile user interaction
    function unlockAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('touchstart', unlockAudioContext, { once: true });
    document.addEventListener('click', unlockAudioContext, { once: true });

    /* ==========================================================================
       3. WAKE LOCK API (SCREEN AWAKE)
       ========================================================================== */
    let wakeLock = null;
    const wakeLockBtn = document.getElementById('wakeLockBtn');

    async function toggleWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          if (!wakeLock) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLockBtn.style.color = 'var(--primary)';
            wakeLockBtn.style.borderColor = 'var(--primary)';
          } else {
            await wakeLock.release();
            wakeLock = null;
            wakeLockBtn.style.color = 'var(--text-muted)';
            wakeLockBtn.style.borderColor = 'var(--card-border)';
          }
        } catch (err) {
          console.warn("Wake lock error:", err);
        }
      } else {
        alert("Tarayıcınız Wake Lock özelliğini desteklemiyor.");
      }
    }
    wakeLockBtn.addEventListener('click', toggleWakeLock);

    /* ==========================================================================
       4. REST TIMER ENGINE
       ========================================================================== */
    let timerTotal = 90;
    let timerRemaining = 90;
    let timerInterval = null;
    let isTimerRunning = false;

    const timerBar = document.getElementById('timerBar');
    const timerClock = document.getElementById('timerClock');
    const timerTargetName = document.getElementById('timerTargetName');
    const timerSvgRing = document.getElementById('timerSvgRing');
    const timerToggleBtn = document.getElementById('timerToggleBtn');
    const timerCloseBtn = document.getElementById('timerCloseBtn');
    const timerAdd15 = document.getElementById('timerAdd15');

    const RING_CIRCUMFERENCE = 2 * Math.PI * 20; // ~125.66

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateTimerUI() {
      timerClock.textContent = formatTime(timerRemaining);
      const fraction = timerRemaining / timerTotal;
      const offset = RING_CIRCUMFERENCE * (1 - fraction);
      timerSvgRing.style.strokeDasharray = `${RING_CIRCUMFERENCE}`;
      timerSvgRing.style.strokeDashoffset = `${offset}`;
    }

    function startRestTimer(durationSeconds, label = "Dinlenme") {
      clearInterval(timerInterval);
      timerTotal = durationSeconds;
      timerRemaining = durationSeconds;
      timerTargetName.textContent = label;
      isTimerRunning = true;
      timerToggleBtn.textContent = "Durdur";
      
      updateTimerUI();
      timerBar.classList.add('active');

      timerInterval = setInterval(() => {
        if (!isTimerRunning) return;

        timerRemaining--;
        updateTimerUI();

        // Check for specific audio alerts: 60s, 30s, 15s, 5s, 0s
        if ([60, 30, 15, 5, 0].includes(timerRemaining)) {
          playAlertSound(timerRemaining);
          if ('vibrate' in navigator) navigator.vibrate(timerRemaining === 0 ? [100, 50, 100] : 40);
        }

        if (timerRemaining <= 0) {
          clearInterval(timerInterval);
          isTimerRunning = false;
          setTimeout(() => {
            timerBar.classList.remove('active');
          }, 1800);
        }
      }, 1000);
    }

    timerToggleBtn.addEventListener('click', () => {
      isTimerRunning = !isTimerRunning;
      timerToggleBtn.textContent = isTimerRunning ? "Durdur" : "Başlat";
    });

    timerCloseBtn.addEventListener('click', () => {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerBar.classList.remove('active');
    });

    timerAdd15.addEventListener('click', () => {
      timerRemaining += 15;
      timerTotal = Math.max(timerTotal, timerRemaining);
      updateTimerUI();
    });

    /* ==========================================================================
       5. STATE MANAGEMENT & LOCAL STORAGE
       ========================================================================== */
    let currentDayIndex = 0;
    const STORAGE_KEY = 'aesthetic_workout_state_v1';

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveState(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    /* ==========================================================================
       6. RENDER LOGIC
       ========================================================================== */
    const dayNav = document.getElementById('dayNav');
    const exerciseContainer = document.getElementById('exerciseContainer');
    const currentDayTitle = document.getElementById('currentDayTitle');
    const progressStatus = document.getElementById('progressStatus');
    const progressBar = document.getElementById('progressBar');
    const resetDayBtn = document.getElementById('resetDayBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');

    soundToggleBtn.addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      soundToggleBtn.textContent = isSoundEnabled ? "🔊" : "🔇";
    });

    function renderDay(dayIndex) {
      currentDayIndex = dayIndex;
      const dayData = WORKOUT_DAYS[dayIndex];
      const savedState = loadSavedState();
      const dayState = savedState[dayIndex] || {};

      // Update Nav Buttons
      document.querySelectorAll('.day-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === dayIndex);
      });

      // Update Header
      currentDayTitle.textContent = dayData.name;

      if (dayData.isRest) {
        resetDayBtn.style.display = 'none';
        progressStatus.textContent = "Dinlenme Günü";
        progressBar.style.width = '100%';
        exerciseContainer.innerHTML = `
          <div class="rest-banner">
            <div class="rest-icon">🧘‍♂️</div>
            <h3 style="font-weight: 700; color: var(--text-main);">Toparlanma & Rejenerasyon</h3>
            <p class="rest-text">${dayData.restMessage}</p>
          </div>
        `;
        return;
      }

      resetDayBtn.style.display = 'block';

      // Count totals
      let totalSets = 0;
      let completedSets = 0;

      let html = '';
      dayData.exercises.forEach((ex, exIdx) => {
        totalSets += ex.sets;
        let setsHtml = '';

        for (let s = 1; s <= ex.sets; s++) {
          const isDone = dayState[`${exIdx}_${s}`] === true;
          if (isDone) completedSets++;

          setsHtml += `
            <div class="set-btn ${isDone ? 'completed' : ''}" 
                 data-ex-idx="${exIdx}" 
                 data-set-num="${s}" 
                 data-rest="${ex.rest}">
              <span class="set-num">${s}. Set</span>
              <span class="set-icon">${isDone ? '✓' : '○'}</span>
            </div>
          `;
        }

        html += `
          <div class="exercise-card">
            <div class="ex-top">
              <div class="ex-name">${ex.name}</div>
            </div>
            <div class="badge-wrap">
              <span class="badge">${ex.target}</span>
              <span class="badge tempo">Tempo: ${ex.tempo}</span>
              <span class="badge rest">⏱ ${ex.rest}s</span>
              ${ex.note ? `<span class="badge" style="background: rgba(239, 68, 68, 0.12); color: #fca5a5;">${ex.note}</span>` : ''}
            </div>
            <div class="sets-row">
              ${setsHtml}
            </div>
          </div>
        `;
      });

      exerciseContainer.innerHTML = html;

      // Update progress bar
      const pct = totalSets > 0 ? Math.round((completedSets / totalSets) * 100) : 0;
      progressStatus.textContent = `${completedSets} / ${totalSets} Set (${pct}%)`;
      progressBar.style.width = `${pct}%`;

      // Attach Set Click Handlers
      document.querySelectorAll('.set-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const exIdx = btn.dataset.exIdx;
          const setNum = btn.dataset.setNum;
          const rest = parseInt(btn.dataset.rest, 10);
          const key = `${exIdx}_${setNum}`;

          const state = loadSavedState();
          if (!state[currentDayIndex]) state[currentDayIndex] = {};

          const currentlyDone = state[currentDayIndex][key] === true;
          state[currentDayIndex][key] = !currentlyDone;
          saveState(state);

          if (!currentlyDone) {
            // Checkmark completed -> trigger intelligent rest timer
            const exName = dayData.exercises[exIdx].name.split('(')[0].trim();
            startRestTimer(rest, `${exName} (#${setNum})`);
            if ('vibrate' in navigator) navigator.vibrate(30);
          }

          renderDay(currentDayIndex);
        });
      });
    }

    // Day nav click
    dayNav.addEventListener('click', (e) => {
      const btn = e.target.closest('.day-btn');
      if (btn) {
        renderDay(parseInt(btn.dataset.day, 10));
      }
    });

    // Reset Day
    resetDayBtn.addEventListener('click', () => {
      if (confirm("Bu günün tüm tamamlanan setleri sıfırlansın mı?")) {
        const state = loadSavedState();
        delete state[currentDayIndex];
        saveState(state);
        renderDay(currentDayIndex);
      }
    });

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    // Initial render
    renderDay(0);
  </script>
</body>
</html>
